name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Unit tests
        run: swift test
      - name: Build universal app
        run: UNIVERSAL=1 VERSION="${GITHUB_REF_NAME#v}" scripts/build-app.sh --zip
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" build/ABreak-*.zip \
            --title "ABreak $GITHUB_REF_NAME" \
            --generate-notes
